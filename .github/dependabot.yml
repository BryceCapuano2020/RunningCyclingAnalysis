version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # No routine version-update PRs. Security updates arrive as PRs through the normal PR gate,
    # and CI audits dependencies on every run.
    open-pull-requests-limit: 0
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
