name: Uptime

# External probe of production every 15 minutes, run from GitHub-hosted runners rather than the
# Worker itself. GitHub may delay or skip scheduled runs under load, and it disables scheduled
# workflows in public repositories after 60 days without repository activity, so this is a
# best-effort monitor. Scheduled runs are opt-in with RCA_UPTIME_ENABLED; manual runs remain
# available. A failing probe opens or updates an issue labelled "outage" and fails the run. A
# passing probe closes open outage issues. A deep check that the API reports as "skipped" (its
# daily probe budget is spent) is a warning only: it neither opens nor closes an outage issue.
# See docs/PRODUCTION.md.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      simulate_outage:
        description: >-
          Probe a non-resolving origin instead of production, so the outage-issue path can be
          tested. Has no effect on scheduled runs.
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || vars.RCA_UPTIME_ENABLED == 'true'
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGIN: ${{ inputs.simulate_outage == true && 'https://simulated-outage.invalid' || vars.PRODUCTION_ORIGIN || 'https://rca-api.nutritioncoachapp.workers.dev' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Probe health, the web app and the Google sign-in redirect
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          failures=()
          # Each probe gets one retry after a pause, so a single dropped request opens no incident.
          probe() {
            local name="$1" url="$2" code=000 attempt
            for attempt in 1 2; do
              code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --max-time 20 "$url" || echo 000)"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 20
            done
            failures+=("$name returned HTTP $code, expected 200")
          }
          probe "health" "$ORIGIN/api/health"
          # The deep check answers 200 with "skipped" once the deployment's probe budget is spent,
          # so an exhausted budget is not reported as an outage. A failing D1 check still is.
          deep_state=ok
          deep_body="$RUNNER_TEMP/deep.json"
          deep_probe() {
            local code=000 attempt
            for attempt in 1 2; do
              code="$(curl --silent --output "$deep_body" --write-out '%{http_code}' \
                --max-time 20 "$ORIGIN/api/health/deep" || echo 000)"
              if [ "$code" = "200" ]; then
                if jq -e '.deep == "skipped"' "$deep_body" > /dev/null 2>&1; then
                  deep_state=skipped
                fi
                return 0
              fi
              sleep 20
            done
            failures+=("deep health returned HTTP $code, expected 200")
          }
          deep_probe
          probe "web app" "$ORIGIN/"

          # The Google redirect must point at the registered callback for this origin.
          expected_uri="$(printf '%s' "$ORIGIN/api/auth/google/callback" | jq -sRr @uri)"
          google_ok=false
          for attempt in 1 2; do
            redirect="$(curl --silent --output /dev/null --max-time 20 \
              --write-out '%{http_code} %{redirect_url}' "$ORIGIN/api/auth/google" || true)"
            if [[ "$redirect" == "302 https://accounts.google.com/"* ]] \
              && grep -Eq "[?&]redirect_uri=${expected_uri}(&|$)" <<< "$redirect"; then
              google_ok=true
              break
            fi
            sleep 20
          done
          if [ "$google_ok" != true ]; then
            failures+=("Google sign-in redirect is not 302 to accounts.google.com with the callback")
          fi

          if [ "$deep_state" = skipped ]; then
            echo "::warning title=Deep health skipped::The deep health budget is spent, so the D1 and R2 check did not run. No outage issue was opened or closed because of it."
          fi
          echo "deep=$deep_state" >> "$GITHUB_OUTPUT"
          if [ "${#failures[@]}" -gt 0 ]; then
            printf -- '- %s\n' "${failures[@]}" > "$RUNNER_TEMP/failures.md"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the outage issue
        if: steps.probe.outputs.failed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh label create outage --color B60205 \
            --description "Production is failing its health checks" --force > /dev/null
          body="$(printf 'The uptime probe failed at %s.\n\n%s\nRun: %s/actions/runs/%s\n' \
            "$(date -u +%FT%TZ)" "$(cat "$RUNNER_TEMP/failures.md")" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          number="$(gh issue list --label outage --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Production health check failing" --label outage --body "$body"
          fi

      - name: Close outage issues after recovery
        if: steps.probe.outputs.failed == 'false' && steps.probe.outputs.deep != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          for number in $(gh issue list --label outage --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "All probes passed at $(date -u +%FT%TZ). Closing."
          done

      - name: Fail the run so the outage is visible in Actions
        if: steps.probe.outputs.failed == 'true'
        run: exit 1
