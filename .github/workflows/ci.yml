name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels that pull request's older run. Each push to main gets its
# own group (its sha), so no main run is ever cancelled or dropped and every main commit gets a verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # npm retries a failed registry request this many times (default 2) before `npm ci` fails.
  npm_config_fetch_retries: '5'

jobs:
  # Classifies a pull request as documentation only when every changed file is Markdown, under docs/
  # or LICENSE. Such a pull request skips the long jobs (typecheck, unit tests, build, simulations,
  # budgets, end to end) and still runs the format check, lint, the ops tests and every unit test that
  # reads a Markdown file. Pushes to main always run everything. The long jobs skip only on an
  # explicit 'false', so if this job fails they run.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; its first parent is the base. No renames, so a
          # file moved from code into docs/ still counts as a code change (the deletion is listed).
          fetch-depth: 2
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          # grep reads the whole list (no -q), so pipefail never sees an early-exit SIGPIPE.
          other=$(printf '%s\n' "$changed" | grep -vE '\.md$|^docs/|^LICENSE$' || true)
          if [ -n "$changed" ] && [ -z "$other" ]; then
            echo "Documentation only: the long jobs are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # Everything in the first required check except the unit tests, which run in shards below.
  static:
    name: Lint, typecheck, build
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
        if: needs.changes.outputs.code != 'false'
      - run: npm run test:deploy-config
      - run: npm run test:ops
      # Documentation only: the unit tests that read a Markdown file (design tokens, the architecture
      # and privacy pages, validation tables). Found by content, so a new one needs no list.
      - name: Unit tests that read documentation
        if: needs.changes.outputs.code == 'false'
        run: |
          files=$(git grep -l -F '.md' -- 'apps/*.test.ts' 'apps/*.test.tsx' 'packages/*.test.ts' ':!*.sim.test.ts' ':!*.perf.test.ts')
          printf '%s\n' "$files"
          npx vitest run $files
      - run: npm run build
        if: needs.changes.outputs.code != 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          name: dist
          path: apps/web/dist
          retention-days: 7
          include-hidden-files: true

  # The unit tests with coverage, split across shards. COVERAGE_SHARD turns off the thresholds in
  # vitest.config.ts, because one shard's coverage is partial; each shard keeps its results and
  # coverage as a blob report, and the required check below merges them and applies the thresholds
  # to the whole run.
  unit:
    name: Unit tests (${{ matrix.shard }} of 2)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      COVERAGE_SHARD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npx vitest run --coverage --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=blob
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob
          retention-days: 1
          include-hidden-files: true

  # The required check. It passes only when the static job passed and every unit shard passed (or,
  # on a documentation-only pull request, was skipped), then merges the shards and applies the
  # coverage thresholds to the whole run.
  verify:
    name: Lint, typecheck, unit tests, build
    needs: [changes, static, unit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the static job and every unit shard
        env:
          CODE: ${{ needs.changes.outputs.code }}
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          echo "static=$STATIC unit=$UNIT code=$CODE"
          if [ "$STATIC" != success ]; then echo "::error::Lint, typecheck, build: $STATIC"; exit 1; fi
          if [ "$UNIT" = skipped ] && [ "$CODE" = false ]; then exit 0; fi
          if [ "$UNIT" != success ]; then echo "::error::Unit tests: $UNIT"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.code != 'false'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
        if: needs.changes.outputs.code != 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      - name: Merge the shards and apply the coverage thresholds
        if: needs.changes.outputs.code != 'false'
        run: npx vitest --mergeReports .vitest/blob --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.changes.outputs.code != 'false'
        with:
          name: coverage
          path: coverage
          retention-days: 7

  # The wall-clock budgets (*.perf.test.ts) are their own job so a loaded runner cannot fail the unit
  # tests, and the unit tests' load cannot fail a budget. They still run on every pull request and
  # fail on a real regression: a budget that fails is run once more, and the job fails only if the
  # second run fails too. A real regression fails both runs; a noisy neighbour rarely fails two in a row.
  perf:
    name: Performance budgets
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Run the budgets, once more if they fail
        run: |
          if ! npm run test:perf; then
            echo "::warning title=Performance budgets::The budgets failed once; running them again. A second failure fails the job."
            npm run test:perf
          fi

  # The statistical simulations (*.sim.test.ts) replay many seeded libraries to measure a detector's
  # hit rate and its silence on nulls. They take minutes under coverage, so they are their own job,
  # run without coverage and in parallel with the unit tests. They are deterministic (seeded), so a
  # failure is a real change in a rate and the job does not retry.
  sim:
    name: Statistical simulations
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run test:sim

  # The Playwright suite split across shards (fullyParallel, so tests spread evenly). Each shard builds
  # the app and starts its own servers; the Worker-runtime check runs once, in the first shard.
  e2e:
    name: End-to-end (${{ matrix.shard }} of 3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # The image ships the browsers and their OS libraries, so the job downloads no apt packages.
    # Its tag must match @playwright/test in package-lock.json (checked by workflow-guards.test.mjs).
    # Its Node (24) differs from .nvmrc (22), so setup-node still installs the project's Node.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      # Guard only: a no-op when the image's browsers match. It never installs OS packages.
      - run: npx playwright install chromium webkit
        working-directory: apps/web
      - run: npm run build
      - run: npm run e2e -w @rca/web -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - run: npm run e2e:worker -w @rca/web
        if: matrix.shard == 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  # The required check: passes only when every end-to-end shard passed (or, on a documentation-only
  # pull request, was skipped).
  e2e-result:
    name: End-to-end (Playwright)
    needs: [changes, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every end-to-end shard
        env:
          CODE: ${{ needs.changes.outputs.code }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "e2e=$E2E code=$CODE"
          if [ "$E2E" = skipped ] && [ "$CODE" = false ]; then exit 0; fi
          if [ "$E2E" != success ]; then echo "::error::End-to-end shards: $E2E"; exit 1; fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm audit --audit-level=moderate --fetch-timeout=30000 --fetch-retries=1 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000
