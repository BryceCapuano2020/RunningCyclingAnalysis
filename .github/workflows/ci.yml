name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # npm retries a failed registry request this many times (default 2) before `npm ci` fails.
  npm_config_fetch_retries: '5'

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:deploy-config
      - run: npm run test:ops
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: apps/web/dist
          retention-days: 7
          include-hidden-files: true

  # The wall-clock budgets (*.perf.test.ts) are their own job so a loaded runner cannot fail the unit
  # tests, and the unit tests' load cannot fail a budget. They still run on every pull request and
  # fail on a real regression: a budget that fails is run once more, and the job fails only if the
  # second run fails too. A real regression fails both runs; a noisy neighbour rarely fails two in a row.
  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Run the budgets, once more if they fail
        run: |
          if ! npm run test:perf; then
            echo "::warning title=Performance budgets::The budgets failed once; running them again. A second failure fails the job."
            npm run test:perf
          fi

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The image ships the browsers and their OS libraries, so the job downloads no apt packages.
    # Its tag must match @playwright/test in package-lock.json (checked by workflow-guards.test.mjs).
    # Its Node (24) differs from .nvmrc (22), so setup-node still installs the project's Node.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      # Guard only: a no-op when the image's browsers match. It never installs OS packages.
      - run: npx playwright install chromium webkit
        working-directory: apps/web
      - run: npm run build
      - run: npm run e2e
      - run: npm run e2e:worker -w @rca/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm audit --audit-level=moderate --fetch-timeout=30000 --fetch-retries=1 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000
