name: Supply chain

# Weekly check of installed dependencies: registry signatures and provenance for everything in the
# lockfile, and known vulnerabilities in production dependencies. Pull requests are checked by the
# audit job in ci.yml, which also covers development dependencies.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain
  cancel-in-progress: false

jobs:
  audit:
    name: Verify signatures and audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Verify registry signatures and provenance
        run: npm audit signatures
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate --fetch-timeout=30000 --fetch-retries=1 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000
