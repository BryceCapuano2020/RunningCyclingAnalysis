<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <title>Page not found · Running Cycling Analysis</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Self-contained: served for any unknown path, at any depth, so it uses no relative URL and no script. */
      :root {
        --paper: #fbfaf8;
        --ink: #0a0a0a;
        --ink-secondary: #6b6660;
        --rule: #dcd8d1;
      }
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Newsreader', Georgia, serif;
        line-height: 1.5;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        margin: 0 0 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--rule);
        font-size: 1.5rem;
        font-weight: 500;
        line-height: 1.1;
      }
      p {
        margin: 0 0 24px;
        color: var(--ink-secondary);
        font-size: 1.0625rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 8px;
        background: var(--ink);
        color: var(--paper);
        font-family: system-ui, sans-serif;
        font-weight: 500;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There is nothing at this address. The app, with your results, is on the home page.</p>
      <a href="/">Go to the app</a>
    </main>
  </body>
</html>
