name = "rca-api"
main = "src/index.ts"
compatibility_date = "2026-09-20"

# Approximate edge limits; admission/storage quotas remain atomic in D1.
# Keep namespace ids unique within this Cloudflare account if other Workers use rate limiting.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "27101"
simple = { limit = 1200, period = 60 }

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "27102"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "27103"
simple = { limit = 600, period = 60 }

# The deep health check does D1 and R2 work, so it allows far fewer calls than the API limiter.
[[ratelimits]]
name = "HEALTH_RATE_LIMITER"
namespace_id = "27104"
simple = { limit = 10, period = 60 }

# Structured logs, retained by Cloudflare for 3 days on the Free plan. Logs never include request
# bodies, query strings, tokens or database error text (see app.ts).
[observability]
enabled = true

# Daily maintenance at 03:17 UTC: expired sessions and leases, old budget rows, pending account
# deletions and orphaned R2 objects. Each step is bounded (see src/maintenance.ts).
[triggers]
crons = ["17 3 * * *"]

# The Worker serves the whole app: the built React app as static assets and the Hono API under
# /api, so both share one origin and session cookies need no custom domain.
# Local development uses wrangler.local.toml, which supplies local R2 for tests.
# The production R2 bucket is private and dedicated to this app. Application-level limits do not
# constrain bucket traffic from other clients or dashboard/API access.
[[d1_databases]]
binding = "DB"
database_name = "rca"
database_id = "6b0d0ada-beab-4c0b-b43a-936a6fd481a8"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "rca-files"

# Production defaults, so a deploy fails closed. Local development overrides both values in
# .dev.vars, which the local Wrangler configuration reads and which takes precedence over [vars].
# APP_URL must be the public origin the app is served from, for example
# https://rca-api.<your-subdomain>.workers.dev (see docs/DEPLOY.md). Google OAuth redirects to
# APP_URL + /api/auth/google/callback.
[vars]
ENVIRONMENT = "production"
APP_URL = "https://rca-api.nutritioncoachapp.workers.dev"

# Requests under /api run the Worker; everything else is served from the built web app. The web app
# has no client-side routes, so an unknown path (including a missing /assets/ file) is a plain 404
# from the asset platform, not index.html, and it never reaches the Worker or its request quota.
# The directory is relative to this file. `npm run build` must have run first.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api", "/api/*"]
