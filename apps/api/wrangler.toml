name = "rca-api"
main = "src/index.ts"
compatibility_date = "2026-09-20"

# Approximate edge limits; admission/storage quotas remain atomic in D1.
# Keep namespace ids unique within this Cloudflare account if other Workers use rate limiting.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "27101"
simple = { limit = 1200, period = 60 }

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "27102"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "27103"
simple = { limit = 600, period = 60 }

# The deep health check does D1 and R2 work, so it allows far fewer calls than the API limiter.
[[ratelimits]]
name = "HEALTH_RATE_LIMITER"
namespace_id = "27104"
simple = { limit = 1, period = 60 }

# Garmin's deregistration notice (POST /api/garmin/deregistration): no session, and up to 100 token checks a call.
# Garmin sends from few addresses, so 120 a minute per address leaves bursts room and bounds a forger.
[[ratelimits]]
name = "NOTICE_RATE_LIMITER"
namespace_id = "27105"
simple = { limit = 120, period = 60 }

# Structured logs, retained by Cloudflare for 3 days on the Free plan. The lines this app writes
# (app.ts, accessLog.ts) never include request bodies, query strings, tokens or database error text.
# Cloudflare's own invocation log for each request does carry the request URL, query string included,
# so an OAuth callback's code and state are in it until it expires.
[observability]
enabled = true

# Daily maintenance at 03:17 UTC: expired sessions and leases, old budget rows, pending account
# deletions and orphaned R2 objects. Each step is bounded (see src/maintenance.ts).
[triggers]
crons = ["17 3 * * *"]

# The Worker serves the whole app: the built React app as static assets and the Hono API under
# /api, so both share one origin and session cookies need no custom domain.
# Local development uses wrangler.local.toml, which supplies local R2 for tests.
# The production R2 bucket is private and dedicated to this app. Application-level limits do not
# constrain bucket traffic from other clients or dashboard/API access.
[[d1_databases]]
binding = "DB"
database_name = "rca"
database_id = "6b0d0ada-beab-4c0b-b43a-936a6fd481a8"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "rca-files"

# Production defaults, so a deploy fails closed. Local development overrides both values in
# .dev.vars, which the local Wrangler configuration reads and which takes precedence over [vars].
# APP_URL must be the public origin the app is served from, for example
# https://rca-api.<your-subdomain>.workers.dev (see docs/DEPLOY.md). Google OAuth redirects to
# APP_URL + /api/auth/google/callback.
[vars]
ENVIRONMENT = "production"
APP_URL = "https://rca-api.nutritioncoachapp.workers.dev"
# Workers Paid: D1 holds 10 GB per database, so the create guard's cap is 8192 MiB (8 GiB, at least 1 GB under
# 10 GB read either way), not the 450 MiB Free default. src/databaseGuard.ts ignores a value outside
# 64..9216, and a test reads this line.
DATABASE_SOFT_LIMIT_MIB = "8192"
# Results computed on the server for every signed-in account (docs/design/server-authority.md). The blocks below are on
# (Workers Paid, both queues created 10 Nov 2026); the deploy-config check requires them, complete.

# Bound on Workers Paid: 60 s of CPU an invocation (Workers Paid allows 300 s; unused time costs nothing), for the largest account the quotas admit: 3,000
# activities, 24 MiB of digests and 60,000 lift sets (apps/api/LIMITS.md records the local figures, taken at the earlier 4,000 and 32 MiB).
[limits]
cpu_ms = 60000

[[queues.producers]]
binding = "STATE_QUEUE"
queue = "rca-state"

[[queues.consumers]]
queue = "rca-state"
max_batch_size = 2
# The invariant, not the number: the compute stays synchronous (`withViewerZone` throws on a promise), so two accounts'
# computes never overlap in an isolate. Raising this is safe only while state/job.ordering.test.ts passes: it runs two
# accounts' jobs interleaved at their D1 and R2 awaits and compares each snapshot with the account computed alone.
max_concurrency = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "rca-state-dlq"

# Requests under /api always run the Worker. Other requests are served from the built web app when a
# file matches. The web app has hash routes, so nothing falls back to index.html; not_found_handling is
# "404-page", which serves the nearest 404.html (apps/web/public/404.html) with a 404 status. Per
# Cloudflare's docs, a browser navigation to an unknown path (compatibility date 2025-04-01 or later)
# is answered by the asset service without invoking the Worker, so it costs no Worker request. A
# non-navigation request to an unknown path (curl, a script, a bot) still reaches the Worker, which
# returns a JSON 404, or a plain-text one under /assets/ (apps/api/src/app.ts); it counts toward the daily
# request quota and not toward API_RATE_LIMITER, which is applied only to /api/* (app.ts, rateLimit.ts).
# The directory is relative to this file. `npm run build` must have run first.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api", "/api/*"]
